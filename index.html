<title>AquaPure</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: deep-navy cinematic hero with a tilting product, then airy white sections; one hash-routed shell with 8 views. */
:root{
  --navy:#082C4C; --ocean:#0879B9; --aqua:#55D6D2; --white:#FFFFFF; --soft:#F3F8FC; --ink:#172B3A;
  --bg:#FFFFFF; --bg2:#F3F8FC; --fg:#172B3A; --muted:#51697a; --line:#d9e6ef; --card:#FFFFFF; --link:#0879B9; --btn:#0879B9; --btnfg:#FFFFFF; --hero-fg:#FFFFFF;
  --display:"Manrope","Noto Sans Devanagari",system-ui,sans-serif; --body:"Public Sans","Noto Sans Devanagari",system-ui,sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px)); --gutr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071a2c;--bg2:#0a2238;--fg:#e8f2f9;--muted:#9db6c8;--line:#1b3a55;--card:#0d2740;--link:#55D6D2;--btn:#55D6D2;--btnfg:#082C4C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#071a2c;--bg2:#0a2238;--fg:#e8f2f9;--muted:#9db6c8;--line:#1b3a55;--card:#0d2740;--link:#55D6D2;--btn:#55D6D2;--btnfg:#082C4C;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--aqua);outline-offset:2px;border-radius:6px}
svg{display:block}
.w{max-width:1160px;margin-inline:auto;padding-left:var(--gut);padding-right:var(--gutr)}
.band{padding-block:72px}
.band.alt{background:var(--bg2)}
.eyebrow{font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--link)}
.sh{display:grid;gap:10px;margin-bottom:36px;max-width:640px}
.sh.c{margin-inline:auto;text-align:center;justify-items:center}
.sh h2{font-size:clamp(1.7rem,3.4vw,2.5rem);font-weight:800}
.sh p{color:var(--muted)}
/* nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--navy);color:#fff}
.nav .w{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.25rem;background:none;border:0;padding:0}
.logo svg{width:30px;height:30px}
.links{display:flex;gap:4px;margin-left:auto;align-items:center}
.links button{background:none;border:0;padding:8px 12px;font-size:.92rem;font-weight:500;color:#cfe3f1;position:relative}
.links button::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:var(--aqua);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.links button:hover::after,.links button[aria-current="page"]::after{transform:scaleX(1)}
.links button[aria-current="page"],.links button:hover{color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:13px 24px;font-family:var(--display);font-weight:700;font-size:.95rem;background:var(--btn);color:var(--btnfg);transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px rgba(8,121,185,.7)}
.btn.aqua{background:var(--aqua);color:var(--navy)}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.btn.line{background:transparent;color:var(--link);border:1.5px solid var(--link)}
.btn.sm{padding:9px 18px;font-size:.86rem}
.nav .btn{background:var(--ocean);color:#fff}
.burger{display:none;margin-left:auto;background:none;border:0;color:#fff;padding:8px}
.theme{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;width:36px;height:36px;display:grid;place-items:center}
@media (max-width:900px){
  .burger{display:block}.links{position:absolute;top:68px;left:0;right:0;background:var(--navy);flex-direction:column;align-items:stretch;padding:8px var(--gutr) 20px var(--gut);margin:0;display:none;border-top:1px solid #1b4468}
  .links.open{display:flex}.links button{text-align:left;padding:13px 4px;font-size:1rem}.links button::after{display:none}
  .links .btn{justify-content:center;margin-top:8px}
}
/* hero */
.hero{background:radial-gradient(1200px 600px at 75% 30%,#0b4f7f 0%,transparent 60%),linear-gradient(180deg,#082C4C,#06213a);color:var(--hero-fg);position:relative;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .w{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:center;padding-block:56px 40px;min-height:540px}
.hero h1{font-size:clamp(2.4rem,5.6vw,4.2rem);font-weight:800}
.hero h1 em{font-style:normal;color:var(--aqua)}
.hero p.lead{color:#bcd6e8;margin-top:18px;max-width:440px;font-size:1.08rem}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.stage{perspective:1000px;display:grid;place-items:center;min-height:440px;position:relative}
.stage .tilt{transform-style:preserve-3d;transition:transform .15s ease-out;width:min(330px,80%);filter:drop-shadow(0 40px 40px rgba(0,0,0,.45))}
.ripple{position:absolute;bottom:34px;left:50%;width:360px;height:90px;transform:translateX(-50%)}
.ripple i{position:absolute;inset:0;border:2px solid rgba(85,214,210,.5);border-radius:50%;animation:rip 4s linear infinite;opacity:0}
.ripple i:nth-child(2){animation-delay:1.3s}.ripple i:nth-child(3){animation-delay:2.6s}
@keyframes rip{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.15);opacity:0}}
.badges{display:flex;gap:28px;flex-wrap:wrap;margin-top:34px}
.badge{display:flex;gap:10px;align-items:center;font-size:.82rem;color:#bcd6e8;line-height:1.3}
.badge b{display:block;color:#fff;font-family:var(--display);font-size:.95rem}
.badge svg{width:34px;height:34px;color:var(--aqua)}
.scrollind{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);color:#9fc3dc;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0}
.scrollind span{width:1px;height:22px;background:linear-gradient(var(--aqua),transparent);animation:sc 1.8s infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:60px;color:var(--bg)}
@media (max-width:900px){.hero .w{grid-template-columns:1fr;padding-top:36px}.stage{min-height:360px;order:-1}}
/* page header */
.phead{background:linear-gradient(120deg,#082C4C,#0b4f7f);color:#fff;position:relative;overflow:hidden}
.phead .w{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding-block:52px}
.phead h1{font-size:clamp(2rem,4.4vw,3.2rem);font-weight:800}
.phead p{color:#bcd6e8;margin-top:10px;max-width:460px}
.phead .art{width:min(260px,38vw);opacity:.95}
.phead::after{content:"";position:absolute;right:-80px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(85,214,210,.25),transparent 65%)}
@media (max-width:640px){.phead .w{grid-template-columns:1fr}.phead .art{display:none}}
/* cards */
.grid{display:grid;gap:20px}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;transition:transform .3s,box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 36px -22px rgba(8,44,76,.4);border-color:var(--aqua)}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(85,214,210,.18);color:var(--ocean);margin-bottom:14px}
:root[data-theme="dark"] .ico{color:var(--aqua)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ico{color:var(--aqua)}}
.ico svg{width:24px;height:24px}
.card h3{font-size:1.05rem;font-weight:700;margin-bottom:6px}
.card p{color:var(--muted);font-size:.92rem}
/* products */
.pcard{display:flex;flex-direction:column;overflow:hidden;padding:0}
.pcard .pic{background:linear-gradient(160deg,#e8f4fb,#cfe8f5);padding:22px;display:grid;place-items:center;height:250px;overflow:hidden}
.pcard .pic svg{height:100%;width:auto;transition:transform .5s}
.pcard:hover .pic svg{transform:scale(1.06) translateY(-4px)}
:root[data-theme="dark"] .pcard .pic{background:linear-gradient(160deg,#0f3552,#0a2238)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pcard .pic{background:linear-gradient(160deg,#0f3552,#0a2238)}}
.pcard .body{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--link)}
.feat{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:.9rem;color:var(--muted)}
.feat li{display:flex;gap:8px;align-items:center}.feat svg{width:16px;height:16px;color:var(--ocean);flex:none}
.pcard .row{display:flex;gap:10px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 20px;font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ocean);color:#fff;border-color:var(--ocean)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.93rem}
th,td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td svg{width:18px;height:18px;color:var(--ocean)}
/* tech */
.tech{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:40px;align-items:center}
.cart{display:grid;gap:0;justify-items:center}
.layer{height:46px;width:200px;border-radius:10px;margin-top:-6px;border:1px solid rgba(8,44,76,.25);transition:transform .35s,box-shadow .35s,filter .35s;filter:saturate(.7) brightness(.97);cursor:pointer;position:relative;box-shadow:0 6px 10px -6px rgba(0,0,0,.35)}
.layer.on{transform:scale(1.14) translateX(10px);filter:none;box-shadow:0 0 0 3px var(--aqua),0 14px 24px -10px rgba(8,121,185,.6);z-index:2}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;width:100%;transition:border-color .25s,transform .25s}
.step:hover{transform:translateX(4px)}
.step[aria-pressed="true"]{border-color:var(--ocean);box-shadow:inset 4px 0 0 var(--aqua)}
.step .n{width:38px;height:38px;border-radius:50%;background:var(--ocean);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800}
.step b{font-family:var(--display);display:block}.step span{color:var(--muted);font-size:.88rem}
@media (max-width:820px){.tech{grid-template-columns:1fr}}
.note{display:flex;gap:12px;background:rgba(85,214,210,.14);border:1px dashed var(--ocean);border-radius:12px;padding:14px 16px;font-size:.88rem;color:var(--muted);align-items:flex-start}
.note svg{width:20px;height:20px;flex:none;color:var(--ocean);margin-top:2px}
/* split / feature band */
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.scene{border-radius:22px;overflow:hidden;position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#dff1f9,#b9dff0)}
.scene svg{width:100%;height:100%}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:10px;align-items:center;background:rgba(8,44,76,.88);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:11px 20px;font-weight:600}
.play svg{width:20px;height:20px;color:var(--aqua)}
.cta{background:linear-gradient(120deg,#082C4C,#0879B9);color:#fff;border-radius:26px;padding:48px 32px;display:grid;gap:14px;justify-items:center;text-align:center;position:relative;overflow:hidden}
.cta h2{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:800}.cta p{color:#cfe7f4;max-width:520px}
/* faq */
.faq{display:grid;gap:10px;max-width:820px;margin-inline:auto}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.q>button{width:100%;display:flex;justify-content:space-between;gap:16px;align-items:center;text-align:left;background:none;border:0;padding:18px 20px;font-family:var(--display);font-weight:700}
.q>button svg{width:20px;height:20px;transition:transform .3s;flex:none}
.q>button[aria-expanded="true"] svg{transform:rotate(45deg)}
.q .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.q .a.open{grid-template-rows:1fr}.q .a>div{overflow:hidden}.q .a p{padding:0 20px 18px;color:var(--muted)}
/* gallery */
.gal{columns:3 220px;column-gap:14px}
.gi{break-inside:avoid;margin-bottom:14px;display:block;width:100%;padding:0;border:0;border-radius:16px;overflow:hidden;background:none;position:relative}
.gi svg{width:100%;height:auto;transition:transform .6s}
.gi:hover svg{transform:scale(1.06)}
.gi span{position:absolute;left:12px;bottom:12px;background:rgba(8,44,76,.82);color:#fff;font-size:.75rem;padding:4px 10px;border-radius:999px}
.gi{overflow:hidden}
.lb{position:fixed;inset:0;z-index:100;background:rgba(4,16,28,.9);display:none;place-items:center;padding:24px}
.lb.open{display:grid}
.lb .in{max-width:min(860px,100%);max-height:82vh;display:grid;gap:12px;color:#fff;justify-items:center}
.lb .in svg{max-height:70vh;max-width:100%;width:auto;border-radius:16px}
.lb .x{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:50%;width:44px;height:44px;display:grid;place-items:center}
.lb .pn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:50%;width:44px;height:44px;display:grid;place-items:center}
.lb .pn.p{left:max(12px,env(safe-area-inset-left,0px))}.lb .pn.nx{right:max(12px,env(safe-area-inset-right,0px))}
/* contact */
.cgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:28px}
@media (max-width:820px){.cgrid{grid-template-columns:1fr}}
form{display:grid;gap:16px}
.f{display:grid;gap:6px}
label{font-weight:600;font-size:.9rem}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
textarea{min-height:120px;resize:vertical}
.err{color:#c0392b;font-size:.82rem;min-height:1em}
:root[data-theme="dark"] .err{color:#ff8c7f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8c7f}}
.f.bad input,.f.bad select,.f.bad textarea{border-color:#c0392b}
.ok{display:none;background:rgba(85,214,210,.16);border:1px solid var(--aqua);border-radius:14px;padding:18px;gap:6px}
.ok.show{display:grid}
.cinfo{display:grid;gap:16px;align-content:start}
.ci{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center}
.ci .ico{margin:0}
.ci b{display:block;font-family:var(--display)}.ci span{color:var(--muted);font-size:.92rem}
.mapph{border-radius:16px;border:1px dashed var(--ocean);aspect-ratio:16/9;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.86rem;padding:16px;background:var(--bg2)}
/* about */
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.vals .card{text-align:center;padding:20px}.vals .ico{margin-inline:auto}
/* modal */
.modal{position:fixed;inset:0;background:rgba(4,16,28,.7);z-index:90;display:none;place-items:center;padding:20px}
.modal.open{display:grid}
.modal .box{background:var(--bg);color:var(--fg);border-radius:22px;max-width:760px;width:100%;max-height:88vh;overflow:auto;display:grid;grid-template-columns:260px 1fr;position:relative}
.modal .pic{background:linear-gradient(160deg,#e8f4fb,#cfe8f5);display:grid;place-items:center;padding:24px}
.modal .pic svg{height:300px;width:auto}
.modal .txt{padding:28px;display:grid;gap:12px;align-content:start}
.modal .x{position:absolute;top:12px;right:12px;background:var(--bg2);border:0;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
@media (max-width:640px){.modal .box{grid-template-columns:1fr}.modal .pic svg{height:200px}}
/* footer */
footer{background:var(--navy);color:#cfe3f1;padding-block:56px 28px}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:32px}
@media (max-width:820px){.fg{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.fg{grid-template-columns:1fr}}
footer h4{color:#fff;font-size:.95rem;margin-bottom:12px}
footer button.fl{display:block;background:none;border:0;padding:4px 0;color:#cfe3f1;text-align:left;font-size:.92rem}
footer button.fl:hover{color:var(--aqua)}
.copy{border-top:1px solid #1b4468;margin-top:36px;padding-top:20px;font-size:.8rem;color:#8fb0c7;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
/* real images */
.pcard .pic,:root .pcard .pic{background:#eef5fa!important}
.pcard .pic img{height:100%;width:auto;max-width:100%;object-fit:contain;transition:transform .5s}
.pcard:hover .pic img{transform:scale(1.06)}
.modal .pic{background:#eef5fa}.modal .pic img{max-height:300px;max-width:100%;object-fit:contain}
.heroimg{width:100%;height:auto;display:block;border-radius:24px;border:1px solid rgba(255,255,255,.18)}
.scene img{width:100%;height:100%;object-fit:cover;display:block}
.phead .art img{width:100%;height:auto;border-radius:18px;display:block;border:1px solid rgba(255,255,255,.2)}
.gi img{width:100%;height:auto;display:block;transition:transform .6s}.gi:hover img{transform:scale(1.06)}
.lb .in img{max-height:70vh;max-width:100%;width:auto;border-radius:16px}
.ctaimg{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--aqua)}
/* motion */
.pre{opacity:0;transform:translateY(22px)}
.rv{transition:opacity .7s ease,transform .7s ease}
#view{animation:pg .5s ease both}
@keyframes pg{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pre{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>

<header class="nav"><div class="w">
  <button class="logo" data-go="home" aria-label="AquaPure home"><svg viewBox="0 0 32 32"><path d="M16 3C16 3 6 14 6 20a10 10 0 0 0 20 0C26 14 16 3 16 3z" fill="#55D6D2"/><path d="M11 21a5 5 0 0 0 5 5" stroke="#082C4C" stroke-width="2" fill="none" stroke-linecap="round"/></svg>AquaPure</button>
  <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="links"></button>
  <nav class="links" id="links" aria-label="Main"></nav>
</div></header>
<main id="view" tabindex="-1"></main>
<footer><div class="w">
  <div class="fg" id="foot"></div>
  <div class="copy"><span>© 2026 AquaPure. Demo website built from a design mockup.</span><span>Contact details, certificates and figures shown are editable placeholders.</span></div>
</div></footer>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer"><button class="x" id="lbx" aria-label="Close"></button><button class="pn p" id="lbp" aria-label="Previous"></button><div class="in" id="lbin"></div><button class="pn nx" id="lbn" aria-label="Next"></button></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Product details"></div>

<script>
(function(){

/* behaviours */
var rafId=0;
function hero(){
 var cv=$('#cv');if(!cv)return;var c=cv.getContext('2d'),W,H,ps=[];
 function size(){W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight;ps=[];for(var i=0;i<38;i++)ps.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*3,v:.15+Math.random()*.4})}
 size();
 var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 function draw(){c.clearRect(0,0,W,H);c.fillStyle='rgba(120,230,235,.4)';ps.forEach(function(p){if(!reduce){p.y-=p.v;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}}c.beginPath();c.arc(p.x,p.y,p.r,0,6.3);c.fill()});if(!reduce)rafId=requestAnimationFrame(draw)}
 draw();
 var st=$('#stage'),t=$('#tilt');
 if(st&&!reduce)st.addEventListener('pointermove',function(e){var r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform='rotateY('+(x*26)+'deg) rotateX('+(-y*12)+'deg)'});
 if(st)st.addEventListener('pointerleave',function(){t.style.transform=''});
}
function reveal(){
 var els=[].slice.call(view.querySelectorAll('.rv'));
 if(!('IntersectionObserver' in window))return;
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.remove('pre');io.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px'});
 els.forEach(function(el,i){if(el.getBoundingClientRect().top>innerHeight){el.classList.add('pre');el.style.transitionDelay=(i%4)*70+'ms';io.observe(el)}});
}
function renderProducts(f){var l=$('#plist');if(!l)return;var a=P.filter(function(p){return f==='all'||p.cat===f});l.innerHTML=a.length?a.map(function(p){return pcard(p)}).join(''):'<p>No products in this category yet.</p>';[].forEach.call(l.querySelectorAll('.rv'),function(e){e.classList.remove('pre')})}
function renderGal(f){var g=$('#gal');if(!g)return;g.innerHTML=GAL.map(function(x,i){return {x:x,i:i}}).filter(function(o){return f==='All'||o.x[1]===f}).map(function(o){return '<button class="gi" data-gi="'+o.i+'" aria-label="Open '+o.x[0]+'">'+galSvg(o.x,o.i)+'<span>'+o.x[0]+'</span></button>'}).join('')}
var lbi=0;
function openLb(i){lbi=(i+GAL.length)%GAL.length;$('#lbin').innerHTML=galSvg(GAL[lbi],lbi)+'<div>'+GAL[lbi][0]+' · '+GAL[lbi][1]+'</div>';$('#lb').classList.add('open');$('#lbx').focus()}
function closeLb(){$('#lb').classList.remove('open')}
function openProd(id){var p=P.filter(function(x){return x.id===id})[0];var m=$('#modal');m.innerHTML='<div class="box"><button class="x" aria-label="Close" id="mx">'+ic('x',18)+'</button><div class="pic">'+A('prod-'+p.id,p.name)+'</div><div class="txt"><span class="tag">'+p.tag+'</span><h2 style="font-size:1.6rem;font-weight:800">'+p.name+'</h2><p style="color:var(--muted)">'+p.d+'</p><ul class="feat">'+p.f.map(function(x){return '<li>'+ic('check')+x+'</li>'}).join('')+'</ul><p style="font-size:.9rem"><b>Capacity:</b> '+p.cap+' &nbsp; <b>Ideal for:</b> '+p.ideal+'</p><div><button class="btn" data-go="contact" data-pick="'+p.name+'">Enquire about '+p.name.replace('AquaPure ','')+'</button></div></div></div>';m.classList.add('open');$('#mx').focus()}
function closeModal(){$('#modal').classList.remove('open')}
var pick='';
function bind(){
 hero();reveal();
 if(route==='products')renderProducts('all');
 if(route==='gallery')renderGal('All');
 if(route==='contact'&&pick){var s=$('#pr');if(s)s.value=pick;pick=''}
 var cf=$('#cf');
 if(cf)cf.addEventListener('submit',function(e){
  e.preventDefault();var ok=true;
  function chk(id,bad,msg){var el=$('#'+id),er=$('#e-'+id);var b=bad(el.value.trim());er.textContent=b?msg:'';el.parentNode.classList.toggle('bad',!!b);el.setAttribute('aria-invalid',b?'true':'false');if(b)ok=false}
  chk('nm',function(v){return v.length<2},'Enter your full name.');
  chk('ph',function(v){return !/^[+\d][\d\s-]{7,}$/.test(v)},'Enter a valid phone number, at least 8 digits.');
  chk('em',function(v){return v&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)},'Enter a valid email address, like name@example.com.');
  chk('ms',function(v){return v.length<5},'Write a short message.');
  var o=$('#ok');o.classList.toggle('show',ok);if(ok){cf.reset()}
 });
}
function go(r,noScroll){
 if(!PAGES[r])r='home';route=r;closeModal();closeLb();cancelAnimationFrame(rafId);
 view.style.animation='none';void view.offsetWidth;view.style.animation='';
 view.innerHTML=PAGES[r]();nav();$('#links').classList.remove('open');$('#burger').setAttribute('aria-expanded','false');
 document.title='AquaPure';
 try{history.replaceState(null,'','#'+r)}catch(e){}
 if(!noScroll)window.scrollTo(0,0);
 bind();
}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-go],[data-prod],[data-f],[data-gf],[data-gi],[data-s],[data-l],[data-scroll],[data-vid],#burger,#theme,#lbx,#lbp,#lbn,#mx,.q>button');if(!t)return;
 if(t.dataset.go){if(t.dataset.pick)pick=t.dataset.pick;go(t.dataset.go);return}
 if(t.dataset.prod){openProd(t.dataset.prod);return}
 if(t.dataset.f){[].forEach.call(document.querySelectorAll('[data-f]'),function(b){b.setAttribute('aria-pressed',b===t)});renderProducts(t.dataset.f);return}
 if(t.dataset.gf){[].forEach.call(document.querySelectorAll('[data-gf]'),function(b){b.setAttribute('aria-pressed',b===t)});renderGal(t.dataset.gf);return}
 if(t.dataset.gi!==undefined){openLb(+t.dataset.gi);return}
 if(t.dataset.s!==undefined||t.dataset.l!==undefined){var n=+(t.dataset.s!==undefined?t.dataset.s:t.dataset.l);[].forEach.call(document.querySelectorAll('.layer'),function(l,i){l.classList.toggle('on',i===n)});[].forEach.call(document.querySelectorAll('.step'),function(l,i){l.setAttribute('aria-pressed',i===n)});return}
 if(t.dataset.scroll){var el=document.getElementById(t.dataset.scroll);if(el)el.scrollIntoView({behavior:'smooth'});return}
 if(t.dataset.vid!==undefined){var s=document.createElement('div');s.className='note';s.style.margin='12px 0 0';s.innerHTML=ic('info')+'The reference video is not embedded in this demo. Add the real video file or link here.';var par=t.parentNode;if(!par.querySelector('.note')){par.appendChild(s);s.style.cssText='position:absolute;left:12px;right:12px;bottom:12px;background:var(--card)'}return}
 if(t.id==='burger'){var o=$('#links').classList.toggle('open');t.setAttribute('aria-expanded',o);return}
 if(t.id==='theme'){var d=document.documentElement,cur=d.getAttribute('data-theme');var dark=cur==='dark'||(!cur&&matchMedia('(prefers-color-scheme:dark)').matches);d.setAttribute('data-theme',dark?'light':'dark');setTheme();return}
 if(t.id==='lbx'){closeLb();return}if(t.id==='lbp'){openLb(lbi-1);return}if(t.id==='lbn'){openLb(lbi+1);return}
 if(t.id==='mx'){closeModal();return}
 if(t.matches('.q>button')){var a=t.nextElementSibling,open=t.getAttribute('aria-expanded')!=='true';t.setAttribute('aria-expanded',open);a.classList.toggle('open',open)}
});
$('#modal').addEventListener('click',function(e){if(e.target===this)closeModal()});
$('#lb').addEventListener('click',function(e){if(e.target===this)closeLb()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeLb();closeModal()}if($('#lb').classList.contains('open')){if(e.key==='ArrowRight')openLb(lbi+1);if(e.key==='ArrowLeft')openLb(lbi-1)}});
$('#lbx').innerHTML=ic('x',20);$('#lbp').innerHTML=ic('left',22);$('#lbn').innerHTML=ic('right',22);
$('#foot').innerHTML=footHtml();
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(PAGES[h]&&h!==route)go(h)});
var h0=location.hash.slice(1);go(PAGES[h0]?h0:'home',true);
})();
